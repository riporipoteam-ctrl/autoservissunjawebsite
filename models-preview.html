<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Model candidates preview</title>
<style>body{font-family:system-ui;background:#fff;color:#111;margin:20px}h2{margin:26px 0 6px}.v{width:100%;height:420px;background:linear-gradient(180deg,#f4f8fb,#e8eff5);border:1px solid #d8e2ec;border-radius:14px}</style></head>
<body>
<h1>3D model candidates</h1>
<h2>A — Sports car (current, blue)</h2><div class="v" id="vA"></div>
<h2>B — Peugeot 308 (Scopia, textured)</h2><div class="v" id="vB"></div>
<h2>C — Ambient vehicle (stylized, blue paint applied)</h2><div class="v" id="vC"></div>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.min.js","three/addons/":"./assets/vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
function viewer(id, url, paintName){
  const el = document.getElementById(id);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  const camera = new THREE.PerspectiveCamera(38, 1, .1, 100);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.autoRotate = true; controls.autoRotateSpeed = 1.4; controls.enablePan = false;
  const draco = new DRACOLoader(); draco.setDecoderPath('assets/vendor/draco/');
  const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
  loader.load(url, g => {
    const model = g.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
    const s = 4.6 / Math.max(size.x, size.z); model.scale.setScalar(s);
    model.position.set(-center.x*s, -box.min.y*s, -center.z*s);
    model.traverse(o => {
      if(o.isMesh && o.material){
        if(paintName && o.material.name === paintName){ o.material.color.set('#0b5fa5'); o.material.metalness = .8; o.material.roughness = .35; }
        if(paintName === '__all__'){ o.material = new THREE.MeshStandardMaterial({color:'#0b5fa5', metalness:.7, roughness:.4}); }
      }
    });
    scene.add(model);
    controls.target.set(0, size.y*s*.45, 0);
    camera.position.set(4.4, size.y*s + .8, 4.6); camera.lookAt(controls.target);
  });
  function rs(){ const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
  rs(); new ResizeObserver(rs).observe(el);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
}
viewer('vA', 'assets/car-3d.glb', 'Body_Color');
viewer('vB', 'assets/candidates/p308.glb', null);
viewer('vC', 'assets/candidates/ambient.glb', '__all__');
</script></body></html>

name: Site quality and mobile tap checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tools/test_frontend_static.py'
      - 'tools/test_browser_smoke.py'
      - 'tools/test_browser_interactions.py'
      - 'tools/verify_live_site.py'
      - '.github/workflows/site-quality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static + Chromium + WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static regression tests
        run: python -m unittest tools/test_frontend_static.py -v

      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit

      - name: Mobile first-tap and map fallback tests
        run: python -m unittest tools/test_browser_smoke.py -v

      - name: Existing navigation + carousel interaction suite in Chromium and WebKit
        run: |
          BROWSER_ENGINE=chromium python -m unittest tools/test_browser_interactions.py -v
          BROWSER_ENGINE=webkit python -m unittest tools/test_browser_interactions.py -v

      - name: Check public deployment matches this commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python tools/verify_live_site.py

name: Temporary .com DNS and GitHub Pages preflight
on:
  push:
    branches: ['launch/autosunja-com-domain']
    paths: ['.github/workflows/domain-preflight.yml']
permissions:
  contents: read
  pages: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check public domain DNS, TLS and current Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, socket, urllib.request
          domains=['autosunja.com','www.autosunja.com']
          for domain in domains:
              print('HOST', domain)
              try:
                  info=socket.getaddrinfo(domain,443)
                  print('SYSTEM DNS A/AAAA:', sorted({i[4][0] for i in info}))
              except Exception as e: print('SYSTEM DNS ERROR',repr(e))
              for qtype in ('A','CNAME','NS') if domain=='autosunja.com' else ('CNAME','A'):
                  url=f'https://cloudflare-dns.com/dns-query?name={domain}&type={qtype}'
                  try:
                      req=urllib.request.Request(url,headers={'accept':'application/dns-json','User-Agent':'SunjaDomainPreflight/1.0'})
                      with urllib.request.urlopen(req,timeout=10) as r:
                          data=json.loads(r.read())
                      print('PUBLIC DNS',qtype,'status',data.get('Status'),'answers',[(a.get('type'),a.get('data')) for a in data.get('Answer',[])])
                  except Exception as e: print('PUBLIC DNS ERROR',qtype,repr(e))
              for scheme in ['https'] if domain.startswith('www') else ['http','https']:
                  url=f'{scheme}://{domain}/'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'SunjaDomainPreflight/1.0'})
                      with urllib.request.urlopen(req,timeout=10) as r:
                          print('HTTP',url,'status',r.status,'redirected to',r.url)
                  except Exception as e: print('HTTP PROBE',url,repr(e))
          token=os.environ.get('GH_TOKEN','')
          if token:
              try:
                  req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/pages',
                      headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'SunjaDomainPreflight/1.0'})
                  with urllib.request.urlopen(req,timeout=10) as r: p=json.loads(r.read())
                  print('GITHUB PAGES:',{k:p.get(k) for k in ('url','html_url','status','cname','https_enforced','https_certificate')})
              except Exception as e:print('GITHUB PAGES API:',repr(e))
          PY

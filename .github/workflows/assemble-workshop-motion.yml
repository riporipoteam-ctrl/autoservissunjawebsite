name: Assemble and verify workshop motion
on:
  push:
    branches: [ops/assemble-workshop-motion]
    paths: ['.github/workflows/assemble-workshop-motion.yml']
permissions: {}
concurrency:
  group: workshop-motion-draft
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'riporipoteam-ctrl/autoservissunjawebsite' && github.ref == 'refs/heads/ops/assemble-workshop-motion'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.assemble.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/blue-service-desk
          fetch-depth: 0
      - id: assemble
        name: Keep the original intro and give the opening scene room to stay in view
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1ca848aba81c103c9dd5118d8ba607b50b4843e6'
          git show 'e5ae36cc319cfdc72e0e8321d90f9963242a507d:tools/settle_workshop_motion.py' > /tmp/settle_workshop.py
          python3 /tmp/settle_workshop.py site
          node --check js/workshop-motion.js
          node --check js/main.js
          git diff --check
          git diff --quiet 807bccbea68ae62270235c9d2ba3240422a42417 -- CNAME .nojekyll robots.txt sitemap.xml css/style.css assets '*.ico' '*icon*.png' 'google*.html'
          git show 807bccbea68ae62270235c9d2ba3240422a42417:index.html > /tmp/site-production.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          a,b=[Path(x).read_bytes() for x in ('/tmp/site-production.html','index.html')]
          def intro(s):
              i=s.index(b'<body>')
              j=s.index(b'</script>',i)+len(b'</script>')
              return s[i:j]
          def map_runtime(s):
              i=s.index(b'    // Globe map (MapLibre')
              j=s.index(b'</script>',i)
              return s[i:j].strip()
          assert intro(a)==intro(b), 'intro differs from main'
          assert map_runtime(a)==map_runtime(b), 'map runtime differs from main'
          for pattern in [rb'<meta name="google-site-verification"[^>]+>',rb'<link rel="canonical"[^>]+>',rb'<script type="application/ld\+json">.*?</script>']:
              matches=re.findall(pattern,a,re.S)
              assert matches and matches==re.findall(pattern,b,re.S), 'search metadata differs from main'
          print('Exact production intro bytes, map runtime, search metadata and protected assets preserved')
          PY
          git add -- index.html css/workshop-motion.css js/workshop-motion.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Pin the dial through its scroll sequence and anchor visitors when they pause'
          git push origin HEAD:refs/heads/redesign/blue-service-desk
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  legacy-audit:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record unchanged legacy suite results for comparison
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/sunja-main 807bccbea68ae62270235c9d2ba3240422a42417
          for d in /tmp/sunja-main "$GITHUB_WORKSPACE"; do
            echo "Legacy checks at $(git -C "$d" rev-parse HEAD)"
            status=0
            (cd "$d"; python3 -m unittest tools/test_frontend_static.py) >/tmp/sunja-legacy.log 2>&1 || status=$?
            grep -E '^(FAIL|ERROR):|^Ran|^OK$|^FAILED' /tmp/sunja-legacy.log || true
            echo "Legacy check exit status: $status (reported, not used to mask functional failures)"
          done

  browser:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
      DRAFT_SHA: ${{ needs.assemble.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the browser and video encoder
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0 imageio-ffmpeg==0.6.0
          python -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Verify native scrolling, controls and each requested size
        run: |
          set -euo pipefail
          git show '2b849cf18ad9395217b018e17b233689d4b6811e:tools/check_workshop_motion.py' > /tmp/check_workshop_motion.py
          git show '5aae16e0d911f9fd72be4eee047ea17ae0969288:tools/finish_workshop_motion.py' > /tmp/finish_workshop.py
          git show 'e5ae36cc319cfdc72e0e8321d90f9963242a507d:tools/settle_workshop_motion.py' > /tmp/settle_workshop.py
          python /tmp/finish_workshop.py reviewer /tmp/check_workshop_motion.py
          python /tmp/settle_workshop.py test /tmp/check_workshop_motion.py
          python /tmp/check_workshop_motion.py
          for size in 1920x1080 1366x768 1024x768 820x1180 768x1024 390x844 360x800; do
            test -s "captures/$size/14-full-page.png"
            test "$(find "captures/$size" -name '*.png' -type f | wc -l)" -ge 12
          done
      - name: Save screenshots, intro and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-motion-${{ matrix.browser }}
          path: captures/
          if-no-files-found: warn
          retention-days: 30

  review-media:
    if: always() && needs.assemble.result == 'success'
    needs: [assemble, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: workshop-motion-chromium
          path: /tmp/workshop-media
      - name: Save the review recording and any complete contact sheets apart from the site
        env:
          DRAFT_SHA: ${{ needs.assemble.outputs.sha }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          out="review/workshop-motion/$DRAFT_SHA"
          mkdir -p "$out"
          cp /tmp/workshop-media/{workshop-scroll.mp4,observations.json} "$out/"
          for f in desktop-review.jpg phone-review.jpg; do
            if [[ "$BROWSER_RESULT" == 'success' || -s "/tmp/workshop-media/$f" ]]; then cp "/tmp/workshop-media/$f" "$out/"; fi
          done
          for f in "$out"/*; do test -s "$f"; done
          git add -- "$out"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Attach review video, stills and browser observations for the draft'
          git push origin HEAD:refs/heads/ops/assemble-workshop-motion
          printf 'Review files for %s: %s\n' "$DRAFT_SHA" "$out"

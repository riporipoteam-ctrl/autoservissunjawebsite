name: Assemble and verify workshop motion
on:
  push:
    branches: [ops/assemble-workshop-motion]
    paths: ['.github/workflows/assemble-workshop-motion.yml']
permissions: {}
concurrency:
  group: workshop-motion-draft
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'riporipoteam-ctrl/autoservissunjawebsite' && github.ref == 'refs/heads/ops/assemble-workshop-motion'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.assemble.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/blue-service-desk
          fetch-depth: 0
      - id: assemble
        name: Keep the current carousel compatible on the exact draft
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '558db842d0305b46c6bac9346b5ae25d5be2be66'
          git show 'cb6f1795c2464348a9c3c4873184872967a6cbad:tools/polish_workshop_motion.py' > /tmp/polish_workshop.py
          python3 /tmp/polish_workshop.py
          node --check js/workshop-motion.js
          node --check js/main.js
          git diff --check
          git diff --quiet 807bccbea68ae62270235c9d2ba3240422a42417 -- CNAME .nojekyll robots.txt sitemap.xml css/style.css assets '*.ico' '*icon*.png' 'google*.html'
          git show 807bccbea68ae62270235c9d2ba3240422a42417:index.html > /tmp/site-production.html
          python3 - <<'PY'
          from pathlib import Path
          a,b=[Path(x).read_bytes() for x in ('/tmp/site-production.html','index.html')]
          def intro(s):
              i=s.index(b'<body>')
              j=s.index(b'</script>',i)+len(b'</script>')
              return s[i:j]
          def map_runtime(s):
              i=s.index(b'    // Globe map (MapLibre')
              j=s.index(b'</script>',i)
              return s[i:j].strip()
          assert intro(a)==intro(b), 'intro differs from main'
          assert map_runtime(a)==map_runtime(b), 'map runtime differs from main'
          print('Exact production intro bytes, map code and asset references preserved')
          PY
          git add -- index.html css/workshop-motion.css js/workshop-motion.js js/main.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve photo playback, full gallery targets and no-script navigation'
          git push origin HEAD:refs/heads/redesign/blue-service-desk
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  legacy-audit:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report old source checks without altering them
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/sunja-main 807bccbea68ae62270235c9d2ba3240422a42417
          for d in /tmp/sunja-main "$GITHUB_WORKSPACE"; do
            echo "Legacy checks at $(git -C "$d" rev-parse HEAD)"
            status=0
            (cd "$d"; python3 -m unittest tools/test_frontend_static.py) >/tmp/sunja-legacy.log 2>&1 || status=$?
            grep -E '^(FAIL|ERROR):|^Ran|^OK$|^FAILED' /tmp/sunja-legacy.log || true
            echo "Legacy check exit status: $status (reported, not used to mask functional failures)"
          done

  browser:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
      DRAFT_SHA: ${{ needs.assemble.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Check motion, controls and each requested size
        run: |
          set -euo pipefail
          git show '2b849cf18ad9395217b018e17b233689d4b6811e:tools/check_workshop_motion.py' > /tmp/check_workshop_motion.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/check_workshop_motion.py')
          s=p.read_text().replace("        check_images(p,p.locator('#header-carousel .carousel-item.active img'))", "        expect(p.locator('#header-carousel .carousel-item').nth(n)).to_have_class(re.compile(r'\\bactive\\b'))\n        check_images(p,p.locator('#header-carousel .carousel-item.active img'))",1)
          s=s.replace("    p.locator('#header-carousel .carousel-control-prev').click()", "    expect(p.locator('#header-carousel .carousel-item').first).to_have_class(re.compile(r'\\bactive\\b'))\n    p.locator('#header-carousel .carousel-control-prev').click()",1)
          s=s.replace("    p.locator('#header-carousel [data-bs-slide-to=\"0\"]').click()", "    expect(p.locator('#header-carousel .carousel-item').nth(2)).to_have_class(re.compile(r'\\bactive\\b'))\n    p.locator('#header-carousel [data-bs-slide-to=\"0\"]').click()",1)
          p.write_text(s)
          PY
          python /tmp/check_workshop_motion.py
      - name: Save screenshots, intro and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-motion-${{ matrix.browser }}
          path: captures/
          if-no-files-found: warn
          retention-days: 30

  review-media:
    needs: [assemble, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: workshop-motion-chromium
          path: /tmp/workshop-media
      - name: Save a watchable review apart from the site
        env:
          DRAFT_SHA: ${{ needs.assemble.outputs.sha }}
        run: |
          set -euo pipefail
          out="review/workshop-motion/$DRAFT_SHA"
          mkdir -p "$out"
          cp /tmp/workshop-media/{desktop-review.jpg,phone-review.jpg,workshop-scroll.mp4,observations.json} "$out/"
          git add -- "$out"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Attach the tested motion draft review in images and video'
          git push origin HEAD:refs/heads/ops/assemble-workshop-motion
          printf 'Review files for %s: %s\n' "$DRAFT_SHA" "$out"

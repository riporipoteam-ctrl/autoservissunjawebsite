name: Capture Auto Servis Sunja website trailer visuals
on:
  push:
    branches: ['creative/autosunja-launch-trailer']
    paths:
      - 'tools/capture_trailer.py'
      - '.github/workflows/trailer-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    name: Film real site in browser
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and recorder
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture website desktop/mobile scrolling and original screenshots
        run: python tools/capture_trailer.py
      - name: Upload only trailer source material
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autosunja-trailer-real-website-capture
          path: trailer_capture/
          retention-days: 30
          if-no-files-found: error

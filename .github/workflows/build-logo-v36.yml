name: Temporary v36 logo quality asset build
on:
  push:
    branches: [fix/intro-sharp-smooth-v36]
    paths: [.github/workflows/build-logo-v36.yml]
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source decoder and pinned image encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Generate original-logo frames and validate 30fps output
        run: |
          python tools/build_intro_animation.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('assets/video/sunja-logo-sharp-smooth-v36.webp')
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = 'faffcf735b6ea397938644154b0e11bcd24a0345183066096d20e0c4dbd0a8f1'
          assert actual == expected, f'Encoding differs from locally reviewed original-frame artifact: {actual}'
          print('PASS: high-quality source-frame WebP SHA256', actual)
          PY
      - name: Commit exact original-frame asset on this feature branch
        run: |
          git config user.name "sunja-logo-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/video/sunja-logo-sharp-smooth-v36.webp
          git commit -m "asset: sharpen original intro and smooth 30fps playback without changing logo"
          git push origin HEAD:fix/intro-sharp-smooth-v36

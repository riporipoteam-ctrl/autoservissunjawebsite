name: Verify and recapture workshop pages
on:
  push:
    branches: [ops/assemble-workshop-motion]
    paths: ['.github/workflows/verify-workshop-paint.yml', 'tools/verify_workshop_paint.py', 'tools/recheck_workshop_viewport.py']
permissions: {}
concurrency:
  group: workshop-paint-review
  cancel-in-progress: false
env:
  DRAFT_SHA: '049b692719c02e00498a10d307f1c2444636f366'
jobs:
  screenshots:
    if: github.repository == 'riporipoteam-ctrl/autoservissunjawebsite' && github.ref == 'refs/heads/ops/assemble-workshop-motion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DRAFT_SHA }}
          path: reviewed-site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up the screenshot browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Check settled pixels and render true viewports and clean stills
        working-directory: reviewed-site
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DRAFT_SHA"
          export CAPTURE_DIR="$GITHUB_WORKSPACE/captures"
          # Apply the review-only options to a temporary copy of the capture harness.
          # The normal viewport checks run before either overlay override is applied.
          python - ../review-tools/tools/verify_workshop_paint.py "$RUNNER_TEMP/verify_workshop_paint.py" <<'PY'
          import ast
          import sys
          from pathlib import Path

          src, out = map(Path, sys.argv[1:])
          text = src.read_text()

          def replace(before, after, count=1):
              global text
              assert text.count(before) == count, before
              text = text.replace(before, after)

          replace("CLEAN = '#wmDock,#backTop{visibility:hidden!important}'", "CLEAN = 'html body #wmDock.mobile-callbar,html body #backTop.wm-icon.back-to-top{display:none!important}'")
          replace("NO_CHROME = CLEAN + '#wmHeader{visibility:hidden!important}'", "NO_CHROME = 'html body #wmHeader{opacity:0!important;transition:none!important}'")
          replace("        shot(p).save(path/'01-first-screen.png')", "        assert p.locator('#wmDock').is_visible() == (w < 992)\n        shot(p).save(path/'01-first-screen.png')")
          replace("        for name,sel in CHAPTERS:", """        if normal is not None:
                      assert p.locator('#wmDock').is_visible() and p.locator('#backTop').is_visible()
                  p.add_style_tag(content=CLEAN)
                  header_style = p.add_style_tag(content=NO_CHROME)
                  raf(p, 9)
                  controls = p.locator('#wmDock,#backTop')
                  hidden_control = 'els=>els.length===2 && els.every(e=>getComputedStyle(e).display==="none" && e.getClientRects().length===0)'
                  assert controls.evaluate_all(hidden_control)
                  for name,sel in CHAPTERS:""")
          replace(',style=NO_CHROME,timeout=', ',timeout=')
          replace('style=NO_CHROME,timeout=', 'timeout=')
          replace('shot(p, style=NO_CHROME)', 'shot(p)')
          replace('style=NO_CHROME+HIDE_IMAGES', 'style=HIDE_IMAGES', 2)
          replace("        rendered.save(path/'06-gallery.png')", "        rendered.save(path/'06-gallery.png')\n        header_style.evaluate('el=>el.remove()')")
          replace('        full = shot(p,full_page=True,style=CLEAN)', '        assert controls.evaluate_all(hidden_control)\n        full = shot(p,full_page=True)')
          replace('style=CLEAN+HIDE_IMAGES', 'style=HIDE_IMAGES')
          replace("'engine':ENGINE,'normal':normal", "'engine':ENGINE,'fixedControlsHiddenInStills':True,'normal':normal")
          ast.parse(text)
          out.write_text(text)
          PY
          python ../review-tools/tools/recheck_workshop_viewport.py "$RUNNER_TEMP/verify_workshop_paint.py"
          test -z "$(git status --porcelain)"
          for size in 1920x1080 1366x768 1024x768 820x1180 768x1024 390x844 360x800; do
            test -s "$CAPTURE_DIR/$size/14-full-page.png"
            test "$(find "$CAPTURE_DIR/$size" -type f -name '*.png' | wc -l)" -ge 12
          done
      - name: Assemble the desktop review sheet
        if: matrix.browser == 'chromium'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path('captures')
          folder = out / '1920x1080'
          items = [
              ('01-first-screen', '01  Početna'), ('02-dial-mid-scroll', '01  Kazaljka pri pomicanju'),
              ('05-services', '02  Usluge'), ('06-gallery', '03  Galerija'),
              ('07-workshop', '04  Radionica'), ('08-reviews', '04  Recenzije'),
              ('09-location', '05  Lokacija'), ('11-contact', '06  Kontakt'),
          ]
          sheet = Image.new('RGB', (1260, 1520), '#101f37')
          draw = ImageDraw.Draw(sheet)
          font = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          title = 'AUTO SERVIS ŠUNJA  /  DESKTOP PREGLED  /  1920 × 1080'
          draw.text((22, 20), title, fill='#dbedff', font=ImageFont.truetype(font, 23))
          label_font = ImageFont.truetype(font, 18)
          for i, (name, label) in enumerate(items):
              x, y = 22 + 623 * (i % 2), 63 + 360 * (i // 2)
              draw.text((x, y), label, fill='#dbedff', font=label_font)
              with Image.open(folder / f'{name}.png') as capture:
                  image = capture.convert('RGB')
                  image.thumbnail((593, 321), Image.Resampling.LANCZOS)
                  sheet.paste(image, (x, y + 26))
          sheet.save(out / 'desktop-review.jpg', quality=91, optimize=True, subsampling=0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-page-captures-${{ matrix.browser }}
          path: captures/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unverified-screenshot-diagnostics-${{ matrix.browser }}
          path: capture-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  review-media:
    if: always() && !cancelled() && needs.screenshots.result != 'skipped'
    needs: screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/assemble-workshop-motion
      - uses: actions/download-artifact@v4
        with:
          pattern: workshop-page-captures-*
          path: /tmp/review-captures
      - uses: actions/download-artifact@v4
        if: needs.screenshots.result == 'failure'
        with:
          pattern: unverified-screenshot-diagnostics-*
          path: /tmp/gallery-diagnostics
      - name: Save review sheets and per-browser paint reports on the review branch
        shell: bash
        env:
          CHECKS: ${{ needs.screenshots.result }}
        run: |
          set -euo pipefail
          out="review/workshop-stills/$DRAFT_SHA/$GITHUB_RUN_ID"
          mkdir -p "$out"
          for engine in chromium webkit; do
            report="/tmp/review-captures/workshop-page-captures-$engine/photo-paint-report.json"
            if [ -e "$report" ]; then cp "$report" "$out/$engine.json"; fi
          done
          if [ "$CHECKS" = success ]; then
            for view in phone desktop; do
              src="/tmp/review-captures/workshop-page-captures-chromium/$view-review.jpg"
              test -s "$src"
              base64 -w 0 "$src" > "$out/$view-review.b64"
              sha256sum "$src" | cut -d' ' -f1 > "$out/$view-review.sha256"
              printf '%s: %s\n' "$view" "$(cat "$out/$view-review.sha256")"
            done
          else
            if [ -d /tmp/gallery-diagnostics ] && find /tmp/gallery-diagnostics -type f -name 'view-*.png' | grep -q .; then
              tar -C /tmp/gallery-diagnostics -czf /tmp/workshop-view-diagnostics.tgz .
              base64 -w 0 /tmp/workshop-view-diagnostics.tgz > "$out/diagnostic-views.b64"
              sha256sum /tmp/workshop-view-diagnostics.tgz | cut -d' ' -f1 > "$out/diagnostic-views.sha256"
            fi
          fi
          git add -- "$out"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save workshop review stills and browser verification'
          git push origin HEAD:refs/heads/ops/assemble-workshop-motion

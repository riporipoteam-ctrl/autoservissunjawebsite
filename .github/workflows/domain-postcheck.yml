name: Temporary custom domain HTTPS verification
on:
  push:
    branches: [launch/autosunja-com-domain]
    paths: [.github/workflows/domain-postcheck.yml]
permissions:
  contents: read
  pages: write
jobs:
  postcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check GitHub Pages domain, A records, www and certificate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,ssl
          repo=os.environ["GH_REPO"]
          token=os.environ["GH_TOKEN"]
          def github(method="GET",body=None):
              url="https://api.github.com/repos/"+repo+"/pages"
              req=urllib.request.Request(url,method=method,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"SunjaDomainAudit/1.0",
                  "Content-Type":"application/json"
              },data=json.dumps(body).encode() if body else None)
              with urllib.request.urlopen(req,timeout=15) as r: return json.load(r)
          try:
              x=github()
              print("PAGES_CONFIG",json.dumps({k:x.get(k) for k in ("html_url","cname","status","https_enforced","https_certificate")}))
              c=x.get("https_certificate") or {}
              if x.get("cname")=="autosunja.com" and c.get("state")=="approved" and not x.get("https_enforced"):
                  try:
                      y=github("PUT",{"https_enforced":True})
                      print("HTTPS_ENABLE",json.dumps({k:y.get(k) for k in ("cname","https_enforced","https_certificate")}))
                  except Exception as exc:
                      print("HTTPS_ENABLE_API_UNAVAILABLE",type(exc).__name__,str(exc)[:210])
          except Exception as exc:print("PAGES_CONFIG_ERROR",type(exc).__name__,str(exc)[:240])
          for domain in ("autosunja.com","www.autosunja.com"):
              for typ in ("A","CNAME"):
                  try:
                      url="https://cloudflare-dns.com/dns-query?name="+domain+"&type="+typ
                      req=urllib.request.Request(url,headers={"Accept":"application/dns-json"})
                      with urllib.request.urlopen(req,timeout=10) as r: data=json.load(r)
                      print("DNS",domain,typ,[(x["type"],x["data"]) for x in data.get("Answer",[])])
                  except Exception as exc:print("DNS_ERROR",domain,typ,str(exc)[:120])
              for scheme in ("https",):
                  try:
                      url=scheme+"://"+domain+"/"
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          page=r.read(10000).decode("utf8","replace")
                          print("WEB",url,"status",r.status,"final",r.url,"has_shop",("Auto Servis Šunja" in page))
                  except Exception as exc: print("WEB_ERROR",url,type(exc).__name__,str(exc)[:220])
          PY

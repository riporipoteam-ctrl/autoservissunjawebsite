name: Build original-logo favicon files

on:
  push:
    branches:
      - codex/favicon-search-map-fast-v40
    paths:
      - tools/build_favicons.py
      - .github/workflows/build-favicons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create high-resolution square icons using original Šunja emblem
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/build_favicons.py
      - name: Verify PNG dimensions, ICO contents and sharp branded exports
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for size in (48, 96, 192, 512):
              p = Path(f"favicon-{size}x{size}.png")
              with Image.open(p) as im:
                  assert im.size == (size, size)
                  assert im.getpixel((size // 2, size // 2)) != (255, 255, 255), p
          with Image.open("favicon.ico") as im:
              assert im.format == "ICO"
              assert im.size[0] >= 48
          with Image.open("apple-touch-icon.png") as im:
              assert im.size == (180, 180)
          print("PASS: valid branded square icons for Google, tabs and iOS.")
          PY
      - name: Commit ready-to-publish binary favicons to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-48x48.png favicon-96x96.png favicon-192x192.png favicon-512x512.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: add sharp square Šunja favicon pack"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

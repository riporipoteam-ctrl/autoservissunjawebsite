name: Website interaction checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tools/test_frontend_static.py'
      - 'tools/test_browser_interactions.py'
      - 'tools/verify_live_site.py'
      - '.github/workflows/website-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tools/test_frontend_static.py'
      - 'tools/test_browser_interactions.py'
      - 'tools/verify_live_site.py'
      - '.github/workflows/website-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source regression tests
        run: python -m unittest tools.test_frontend_static
      - name: Install Chromium browser test requirements
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Mobile and desktop first-tap browser tests
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python -m unittest -v tools.test_browser_interactions

  live-deployment:
    # GitHub Pages deploys the main branch; verify its public result after tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm real public Pages deployment and asset versions
        run: python tools/verify_live_site.py

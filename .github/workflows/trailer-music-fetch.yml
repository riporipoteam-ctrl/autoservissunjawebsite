name: Fetch commercially licensed online soundtrack candidates
on:
  push:
    branches: [creative/autosunja-launch-trailer]
    paths: [.github/workflows/trailer-music-fetch.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Download Mixkit Stock Music Free License tracks from official CDN
        run: |
          mkdir -p music_candidates
          python - <<'PY'
          import urllib.request, os, hashlib
          tracks = {'techno-fights': 171, 'tech-house-vibes':130}
          for name,num in tracks.items():
              url=f'https://assets.mixkit.co/music/{num}/{num}.mp3'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PromotionalVideo/1.0)'})
                  with urllib.request.urlopen(req, timeout=22) as r:
                      contents=r.read()
                      print(name,'HTTP',r.status,'type',r.headers.get('Content-Type'),'bytes',len(contents), flush=True)
                  if len(contents)<100000 or (not contents.startswith(b'ID3') and contents[0] != 0xff):
                      print(name,'INVALID MP3',contents[:110],flush=True); continue
                  dest=f'music_candidates/{name}.mp3'
                  open(dest,'wb').write(contents)
                  print(name,'sha256',hashlib.sha256(contents).hexdigest(),flush=True)
              except Exception as e: print(name,'DOWNLOAD ERROR',repr(e),flush=True)
          PY
          echo "Downloaded tracks:"
          ls -lh music_candidates/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autosunja-mixkit-licensed-online-music
          path: music_candidates/
          retention-days: 10
          if-no-files-found: warn
